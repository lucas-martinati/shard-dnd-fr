name: Vérifier les traductions et le script

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run translations:check
      - run: npm run build
      - name: Vérifier que les livrables correspondent aux sources
        run: git diff --exit-code
      - run: npm test
